    />

    <title>Yamaha MT-07 — Master of Torque | Monte a sua</title>

    <!-- SEO: a descrição é o que aparece no resultado de busca e no card de
         compartilhamento; a URL canônica evita que o mesmo conteúdo conte como
         duas páginas. Trocar de domínio é trocar a constante abaixo em três
         lugares: canonical, og:url e twitter:url. -->
    <meta
      name="description"
      content="Landing page de compra da Yamaha MT-07: ficha técnica do motor CP2 de 689 cc, 74,8 cv de potência e configurador em cinco passos para escolher cor, opcionais e fechar o pedido."
    />
    <meta name="author" content="João Marcos" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B0C0D" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://purchase-page-yamaha-mt-07.vercel.app/" />

    <!-- Open Graph: WhatsApp, LinkedIn, Slack, Discord -->

    <meta property="og:site_name" content="Yamaha MT-07" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://purchase-page-yamaha-mt-07.vercel.app/" />
    <meta property="og:title" content="Yamaha MT-07 — Master of Torque" />

      property="og:description"
      content="Motor CP2 de 689 cc, 74,8 cv e 6,9 kgf.m. Monte a sua em cinco passos: cor, opcionais, seus dados, entrega e pagamento."
    />
    <meta property="og:image" content="https://purchase-page-yamaha-mt-07.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Yamaha MT-07 em uma garagem escura, com a ficha de desempenho ao lado"
    />

    <!-- Twitter/X: card grande usa a mesma imagem do Open Graph -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yamaha MT-07 — Master of Torque" />
    <meta
      name="twitter:description"
      content="Motor CP2 de 689 cc, 74,8 cv e 6,9 kgf.m. Monte a sua em cinco passos."
